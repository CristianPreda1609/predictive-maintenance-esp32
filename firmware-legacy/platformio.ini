; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; --- MODIFICAREA MAGICĂ ---
; Aceasta linie spune compilatorului sa aloce 3MB pentru aplicatie (in loc de 1.3MB)
board_build.partitions = huge_app.csv
lib_ldf_mode = chain

lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    adafruit/Adafruit MPU6050 @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit BusIO @ ^1.14.1
    ; Forțăm versiunile corecte și compatibile pentru stabilitate maximă
    ; Necesare doar pentru main_with_web.cpp (OLED + server async)
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; In src/ sunt trei variante cu setup()/loop(); se compileaza una singura.
; Implicit: main.cpp (inferenta pe serial).
; Pentru varianta cu OLED + web async, schimba filtrul in:
;   build_src_filter = +<*> -<main.cpp> -<mainC.cpp>
build_src_filter = +<*> -<main_with_web.cpp> -<mainC.cpp>
